<svg xmlns="http://www.w3.org/2000/svg" width="760" height="460" viewBox="0 0 760 460"><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="m1 1 7 4-7 4" fill="none" stroke="#2459d3" stroke-width="1.6"/></marker></defs><rect width="760" height="460" fill="#f5f8ff"/><text x="44" y="47" font-family="Arial,sans-serif" font-size="14" letter-spacing="2" fill="#52617a">CURI · THE RESEARCH LOOP</text><g fill="none" stroke="#2459d3" stroke-width="1.5" marker-end="url(#arrow)"><path d="M282 137H473"/><path d="M592 179V239"/><path d="M476 283H287"/><path d="M169 239V184"/></g><g fill="#f5f8ff" stroke="#c4cee2"><rect x="51" y="91" width="232" height="88" rx="18"/><rect x="477" y="91" width="232" height="88" rx="18"/><rect x="477" y="243" width="232" height="88" rx="18"/><rect x="51" y="243" width="232" height="88" rx="18"/></g><g font-family="Georgia,serif" font-size="26" fill="#14213f" text-anchor="middle"><text x="167" y="128">Ask &amp; interpret</text><text x="593" y="128">Admit a study</text><text x="593" y="280">Run the experiment</text><text x="167" y="280">Check independently</text></g><g font-family="Arial,sans-serif" font-size="13" fill="#52617a" text-anchor="middle"><text x="167" y="152">Question · competing explanations</text><text x="593" y="152">Prior evidence · no duplicates</text><text x="593" y="304">Isolated Git worktree</text><text x="167" y="304">Rerun the decisive checks</text></g><path d="M51 137H28V377H582" fill="none" stroke="#c4cee2"/><circle cx="167" cy="377" r="3" fill="#2459d3"/><g font-family="Arial,sans-serif" fill="#52617a"><text x="192" y="373" font-size="15">Keep the finding and its evidence.</text><text x="192" y="397" font-size="13">Negative and inconclusive results stay in the record.</text></g></svg>
