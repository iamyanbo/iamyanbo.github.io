<g stroke="#b1bed4" stroke-width="1.4"><rect x="40" y="48" width="290" height="132" rx="8" fill="#e8efff"/><rect x="430" y="48" width="290" height="132" rx="8" fill="#f0ebfc"/><rect x="430" y="272" width="290" height="132" rx="8" fill="#eaf2fb"/><rect x="40" y="272" width="290" height="132" rx="8" fill="#fff0e7"/></g>
<g stroke-width="4" stroke-linecap="round"><path d="M40 63v102" stroke="#315bc0"/><path d="M430 63v102" stroke="#8063c4"/><path d="M430 287v102" stroke="#5083b5"/><path d="M40 287v102" stroke="#ce794c"/></g>
<g font-family="Georgia,serif" font-size="29" fill="#14213f" text-anchor="middle"><text x="185" y="94">Ask &amp; interpret</text><text x="575" y="94">Design a test</text><text x="575" y="318">Run the study</text><text x="185" y="318">Verify</text></g>
<g font-family="Arial,sans-serif" font-size="21" fill="#52617a" text-anchor="middle"><text x="185" y="130">A question</text><text x="185" y="157">Competing explanations</text><text x="575" y="130">Prior evidence</text><text x="575" y="157">An admitted experiment</text><text x="575" y="354">Execute the experiment</text><text x="575" y="381">Collect the result</text><text x="185" y="354">Independent rerun</text><text x="185" y="381">Decisive checks</text></g>
<path d="M185 404V443" fill="none" stroke="#315bc0" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="40" y="452" width="680" height="94" rx="5" fill="#f5f8ff" stroke="#b1bed4" stroke-width="1.4"/>
