<svg xmlns="http://www.w3.org/2000/svg" width="760" height="560" viewBox="0 0 760 560" role="img" aria-labelledby="title desc">
<title id="title">CURI research loop</title><desc id="desc">Ask and interpret, design an admitted test, run the study, and independently verify it. The result returns to interpretation; positive, negative and inconclusive evidence remains in the record.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="m2 1 6 4-6 4" fill="none" stroke="#315bc0" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
