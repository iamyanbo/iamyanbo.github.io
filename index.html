<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>SYDE 671</title><style>
:root{--ink:#202521;--muted:#66716c;--line:#dce4df;--paper:#f7f8f5;--green:#2d6b50;--gold:#e2bb68}
*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font:16px/1.55 "Segoe UI",Arial,sans-serif}
.wrap{max-width:1040px;margin:auto;padding:34px 24px 80px}a{color:var(--green)}h1{font:600 clamp(2.3rem,6vw,4.4rem)/1.03 Georgia,serif;letter-spacing:-.04em;margin:20px 0 14px}
h2{font:600 1.8rem/1.2 Georgia,serif;margin:58px 0 12px}h3{font-size:1.12rem;margin:32px 0 8px}p{margin:0 0 14px}.eyebrow,.sub,figcaption{color:var(--muted)}.eyebrow{text-transform:uppercase;letter-spacing:.12em;font-size:.78rem;font-weight:700}.lede{font-size:1.15rem;max-width:680px;color:#46524c}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin:28px 0}.stat{background:#fff;border:1px solid var(--line);border-radius:12px;padding:16px}.stat b{display:block;font:600 1.8rem Georgia,serif;color:var(--green)}.stat span{font-size:.9rem;color:var(--muted)}
img{display:block;width:100%;height:auto;border:1px solid var(--line);border-radius:10px;background:#fff}figure{margin:0 0 18px}figcaption{font-size:.88rem;margin-top:7px}.gallery,.comparison,.part1{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.gallery img{aspect-ratio:1.35;object-fit:cover}.lowres-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.lowres-card{background:#fff;border:1px solid var(--line);border-radius:12px;padding:12px}.lowres-card h4{margin:0 0 8px}.metric-pair{display:grid;grid-template-columns:1fr 1fr;gap:8px}.metric-pair figure{margin:0}.metric-pair img{aspect-ratio:1.25;object-fit:contain}.lowres-card p{font-size:.82rem;margin:10px 0 0}.comparison img{height:210px;object-fit:contain}.twocol{display:grid;grid-template-columns:1fr 1fr;gap:12px}.twocol img{height:240px;object-fit:contain}.part1{grid-template-columns:repeat(2,1fr)}.part1 img{aspect-ratio:4/3;object-fit:cover}
.note{background:#fff7e3;border-left:3px solid var(--gold);padding:12px 15px;border-radius:0 8px 8px 0;color:#564722}table{border-collapse:collapse;width:100%;margin:14px 0 24px;background:#fff;border:1px solid var(--line);font-size:.86rem}th,td{text-align:left;padding:8px 9px;border-bottom:1px solid var(--line);vertical-align:top}thead th{font-size:.74rem;text-transform:uppercase;letter-spacing:.04em;color:var(--muted)}td.n{white-space:nowrap;font-variant-numeric:tabular-nums}.ok{color:#24744c}.bad{color:#ad3f32;font-weight:700}code{background:#edf1ed;padding:1px 4px;border-radius:4px;font-size:.9em}.foot{border-top:1px solid var(--line);margin-top:46px;padding-top:16px;color:var(--muted);font-size:.9rem}
.external-preview{width:110px;max-height:140px;object-fit:contain;margin:auto}
@media(max-width:700px){.wrap{padding:24px 16px 56px}.stats{grid-template-columns:1fr}.gallery,.comparison,.part1,.lowres-grid{grid-template-columns:repeat(2,1fr)}.comparison img{height:160px}.twocol{grid-template-columns:1fr}table{font-size:.76rem}th,td{padding:6px}}
</style></head>
<body><main class="wrap"><p class="eyebrow">SYDE 671</p><h1>Coursework</h1>
<p><a href="./1/index.html">Assignment 1</a></p></main></body></html>
